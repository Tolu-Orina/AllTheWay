# Web build + Firebase Hosting deploy.
#
# Deliberately browserless: the site is a client-rendered SPA, so there is no
# prerender step and nothing here needs Chromium. Playwright stays a
# devDependency for local audits and is never installed in CI.
#
# Triggered per branch (develop -> dev site, main -> prod site) with _SITE_ID
# supplied by the trigger, so this file is identical for both environments.
#
# ## Everything runs from the repo root, not from web/
#
# `web/src` imports `@alltheway/contracts`, a sibling workspace. It is not in
# web's own package.json and not in web's lockfile — it resolves locally only
# because npm workspaces hoists it into the *root* node_modules.
#
# So `npm ci` with `dir: web` installs an isolated tree where that package does
# not exist, and the build fails at the first import. Same lesson as the service
# images: a workspace member cannot be built from inside its own directory.
#
# Installing at the root also runs the root `postinstall`, which builds
# contracts to the JavaScript that web actually imports.
#
# ## Why web/package.json declares Linux binaries it never imports
#
# npm records only the *building* platform's binding for a package's
# platform-specific optionalDependencies (npm/cli#4828). The lockfile was
# generated on Windows, so `npm ci` on this Linux worker could not install
# bindings the lockfile never mentioned — oxlint, rolldown, rollup, tailwind's
# oxide, lightningcss and sharp all failed this way, one build at a time.
#
# Declaring each `-linux-x64-gnu` package explicitly puts it in the lockfile.
# They are *optional*, so Windows and macOS skip them on an os/cpu mismatch
# rather than failing. Only `-gnu` variants: this image is Debian (glibc), not
# Alpine (musl).
#
# The alternative is `npm install` instead of `npm ci`, which resolves per
# platform correctly — at the cost of the lockfile no longer being authoritative,
# which is the guarantee that makes CI reproducible.

substitutions:
  _SITE_ID: alltheway-dev

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

steps:
  - id: install
    name: node:22-slim
    entrypoint: npm
    # `npm ci` not `npm install`: fails loudly if the lockfile is out of date
    # rather than silently resolving different versions than we tested.
    # No `dir:` — this is the workspace root, which is the point.
    args: ["ci", "--no-audit", "--no-fund"]

  - id: lint
    name: node:22-slim
    entrypoint: npm
    args: ["run", "lint", "--workspace", "web"]

  # The browser needs Firebase's apiKey, authDomain and projectId, and they are
  # generated by Firebase rather than derivable from the project id. Fetched
  # here rather than passed as substitutions so the values cannot drift from
  # what Terraform actually created.
  #
  # Written to web/.env.production, which Vite loads automatically for a
  # production build and exposes to the bundle as VITE_*.
  #
  # These are public values by design: a Firebase web API key identifies the
  # project, it does not authorise anything. Access is controlled by Firebase
  # security rules and by the gateway verifying ID tokens.
  - id: firebase-config
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        CONFIG=$$(curl -sSf           -H "Authorization: Bearer $$(gcloud auth print-access-token)"           "https://firebase.googleapis.com/v1beta1/projects/${PROJECT_ID}/webApps/-/config")

        API_KEY=$$(echo "$$CONFIG" | python3 -c 'import json,sys; print(json.load(sys.stdin)["apiKey"])')
        AUTH_DOMAIN=$$(echo "$$CONFIG" | python3 -c 'import json,sys; print(json.load(sys.stdin)["authDomain"])')

        # Refuse to write a half-config. A bundle missing these fails closed at
        # runtime now, but an empty value would be a confusing way to find out.
        test -n "$$API_KEY" && test -n "$$AUTH_DOMAIN"

        {
          echo "VITE_FIREBASE_API_KEY=$$API_KEY"
          echo "VITE_FIREBASE_AUTH_DOMAIN=$$AUTH_DOMAIN"
          echo "VITE_FIREBASE_PROJECT_ID=${PROJECT_ID}"
        } > web/.env.production

        echo "firebase config written for ${PROJECT_ID} (authDomain $$AUTH_DOMAIN)"
  - id: build
    name: node:22-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Contracts first, explicitly. The root postinstall already does this,
        # but relying on a lifecycle hook for a build-order dependency means a
        # future `--ignore-scripts` breaks the build in a way nobody expects.
        npm --workspace @alltheway/contracts run build
        npm --workspace web run build

  # Bind the single hosting config to this environment's site, then deploy it.
  # One config for both environments means dev and prod cannot drift apart.
  # firebase.json lives at the root, because Firestore, Auth and Hosting are all
  # workspace-wide concerns.
  - id: deploy
    name: node:22-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # The hosting target is named after the site, so one substitution drives
        # both the binding and the deploy. firebase.json carries one hosting entry
        # per environment because each rewrites /api/** to a differently-named
        # Cloud Run service (gateway-dev vs gateway-prod) — a single shared entry
        # cannot name both, and Hosting only discovers that when it finalises the
        # version, after the upload has already succeeded.
        npx --yes firebase-tools@14 target:apply hosting "${_SITE_ID}" "${_SITE_ID}" --project "${PROJECT_ID}"
        npx --yes firebase-tools@14 deploy --only "hosting:${_SITE_ID}" --project "${PROJECT_ID}" --non-interactive --message "${SHORT_SHA} on ${BRANCH_NAME}"

timeout: 900s
