[project]
name = "alltheway-agentauth"
version = "0.0.0"
description = "Google-signed identity tokens for service-to-service A2A calls."
requires-python = ">=3.11"
dependencies = ["google-auth>=2.30"]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
