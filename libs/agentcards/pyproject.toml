[project]
name = "alltheway-agentcards"
version = "0.0.0"
description = "Signing and verifying A2A AgentCards, so a card cannot be spoofed."
requires-python = ">=3.11"
dependencies = [
  # Already present transitively via google-auth; declared because this module
  # depends on it directly and a transitive dependency is not a contract.
  "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
