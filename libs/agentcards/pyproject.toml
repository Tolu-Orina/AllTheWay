[project]
name = "alltheway-agentcards"
version = "0.0.0"
description = "Signing and verifying A2A AgentCards, so a card cannot be spoofed."
requires-python = ">=3.11"
dependencies = [
  # Already present transitively via google-auth; declared because this module
  # depends on it directly and a transitive dependency is not a contract.
  "cryptography>=42",
]

[project.optional-dependencies]
# Only a service that SIGNS a card needs protobuf, to serialise the card
# exactly as its route serves it. A verifier is handed the JSON that arrived on
# the wire, so it carries neither this nor the A2A SDK. Declared as an extra
# rather than a dependency so that asymmetry is visible here rather than
# discovered by a build failing.
sign = ["protobuf>=5.0"]
test = ["pytest>=8.0", "protobuf>=5.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
