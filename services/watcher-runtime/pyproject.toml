[project]
name = "alltheway-watcher-runtime"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  # Shared, installed from the local wheelhouse in the image.
  "alltheway-policy",
  # Mandatory screening of untrusted external content (manifest risk table).
  "alltheway-screening",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.9",
  "google-cloud-firestore>=2.19",
  "httpx>=0.27",
  # Imported by app/a2a_client.py. Was missing: the dev machine had it
  # installed globally, so nothing failed until a clean image build.
  "a2a-sdk>=1.1",
  "protobuf>=5.0",
]

[project.optional-dependencies]
# Installed only in the image's test stage, never in the runtime layer.
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
# The shared autonomy floor. Installed properly in the image; on the path
# here so the suite runs without an editable install step.
pythonpath = [".", "../../libs/policy/src", "../../libs/screening/src"]
