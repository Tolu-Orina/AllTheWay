[project]
name = "alltheway-orchestrator"
version = "0.0.0"
description = "Orchestrator: Clarify Gate, Plan Panel graph, research delegation."
requires-python = ">=3.11"
dependencies = [
  # Shared, installed from the local wheelhouse in the image.
  "alltheway-agentcards",
  "alltheway-policy",
  # Identity for service-to-service A2A calls. Without it, every
  # internal call is rejected by Cloud Run in a deployed environment.
  "alltheway-agentauth",
  "alltheway-screening",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.9",
  # The [fastapi] extra, not bare a2a-sdk: the JSON-RPC server path imports
  # sse_starlette, which the base package does not install. Bare a2a-sdk
  # builds fine and then fails at container start.
  "a2a-sdk[fastapi]>=1.1",
  # Imported directly (json_format, struct_pb2), not just via a2a-sdk.
  "protobuf>=5.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
# Installed only in the image's test stage, never in the runtime layer.
test = ["pytest>=8.0"]
# Vertex is only needed to run against a real model. The fake provider makes
# the whole graph runnable and testable with no credentials at all.
# google-adk was declared here and never imported. Removed once Phase 3 decided
# against it: ParallelAgent is deprecated and provides none of the bounds the
# research cell needs. See docs/decisions/0002.
vertex = ["google-genai>=1.0"]

[tool.pytest.ini_options]
# The shared autonomy floor. Installed properly in the image; on the path
# here so the suite runs without an editable install step.
pythonpath = [".", "../../libs/agentcards/src", "../../libs/policy/src", "../../libs/agentauth/src", "../../libs/screening/src"]
