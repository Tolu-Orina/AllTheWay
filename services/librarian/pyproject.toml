[project]
name = "alltheway-librarian"
version = "0.0.0"
description = "Documents in, retrieval out. Scoped to exactly one user."
requires-python = ">=3.11"
dependencies = [
  "alltheway-screening",
  # Signs the AgentCard the registry verifies. Declared rather than
  # inherited: nothing else here pulls it in.
  "alltheway-agentcards",
  "alltheway-scopetoken",
  "alltheway-metering",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.9",
  "httpx>=0.27",
  "google-cloud-firestore>=2.19",
    # The `[requests]` extra, not bare google-auth: `google.auth.transport.requests`
  # raises ImportError without the `requests` package, and google-auth does not
  # install it. This module imports that transport directly.
  "google-auth[requests]>=2.35",
  # Mechanical text extraction. Runs before any model sees the content, and
  # deliberately in this service rather than the gateway: a malicious PDF
  # attacks the parser, and this process holds no connector credentials.
  "pypdf>=5.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = [".", "../../libs/screening/src", "../../libs/scopetoken/src", "../../libs/metering/src"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
