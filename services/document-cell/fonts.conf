<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- PPTX names Calibri (what PowerPoint uses). Linux has Carlito, which
       is metric-compatible, so LibreOffice visual QA matches the grid. -->
  <alias>
    <family>Calibri</family>
    <prefer>
      <family>Carlito</family>
    </prefer>
  </alias>
</fontconfig>
