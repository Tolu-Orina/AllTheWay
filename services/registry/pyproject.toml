[project]
name = "alltheway-registry"
version = "0.0.0"
description = "The Agent Registry: a catalogue of AgentCards, with their signatures checked."
requires-python = ">=3.11"
dependencies = [
  "alltheway-agentcards",
  "alltheway-agentauth",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
pythonpath = [".", "../../libs/agentcards/src", "../../libs/agentauth/src"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
