[project]
name = "alltheway-profile-synthesizer"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "pydantic>=2.9",
  "google-cloud-firestore>=2.19",
]

[project.optional-dependencies]
# Installed only in the image's test stage, never in the runtime layer.
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
